plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'resume.creator.backend'
version = '0.0.1'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(23)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation("org.xerial:sqlite-jdbc:3.45.1.0")
	implementation("org.hibernate:hibernate-community-dialects:6.6.3.Final")

	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	
	implementation files('lib/resume-creator-logic-domain.jar')
	implementation files('lib/resume-creator-logic-infrastructure.jar')
}

tasks.named('test') {
	useJUnitPlatform()
}
